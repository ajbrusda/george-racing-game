<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calvin's George Racing Extravaganza!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #1a1a2e;
    color: white;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }

  #menu-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    position: relative;
    overflow: hidden;
  }

  #menu-screen::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
    animation: menuPulse 4s ease-in-out infinite;
  }

  @keyframes menuPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .menu-title {
    font-family: 'Fredoka One', cursive;
    font-size: 3.5em;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    margin-bottom: 10px;
    z-index: 1;
    animation: titleBounce 2s ease-in-out infinite;
  }

  .menu-subtitle {
    font-size: 1.3em;
    opacity: 0.9;
    margin-bottom: 30px;
    z-index: 1;
  }

  @keyframes titleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .george-preview {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid white;
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
    margin-bottom: 20px;
    z-index: 1;
    animation: spin 8s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .menu-panel {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px 40px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    min-width: 320px;
  }

  .menu-input {
    padding: 12px 20px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 1.1em;
    font-family: 'Nunito', sans-serif;
    width: 100%;
    text-align: center;
    outline: none;
    transition: border-color 0.3s;
  }

  .menu-input:focus {
    border-color: #ffd700;
  }

  .menu-input::placeholder {
    color: rgba(255,255,255,0.5);
  }

  .btn {
    padding: 14px 35px;
    border-radius: 14px;
    border: none;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2em;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn-host {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: white;
  }

  .btn-join {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: white;
  }

  .btn-ready {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #1a1a2e;
  }

  .divider {
    color: rgba(255,255,255,0.5);
    font-size: 0.9em;
  }

  .room-code {
    font-family: 'Fredoka One', cursive;
    font-size: 2.5em;
    color: #ffd700;
    letter-spacing: 8px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  }

  .status-text {
    font-size: 1em;
    opacity: 0.8;
  }

  #waiting-screen, #game-screen, #result-screen {
    display: none;
    height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #waiting-screen {
    background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
  }

  #result-screen {
    background: linear-gradient(135deg, #ffd700 0%, #ff6b6b 100%);
  }

  #game-screen {
    background: #87CEEB;
  }

  canvas {
    display: block;
  }

  .error-msg {
    color: #ff6b6b;
    font-weight: bold;
    min-height: 24px;
    text-align: center;
  }

  .scores-display {
    display: flex;
    gap: 40px;
    margin: 20px 0;
  }

  .score-card {
    background: rgba(255,255,255,0.2);
    padding: 15px 30px;
    border-radius: 15px;
    text-align: center;
  }

  .score-card .name { font-size: 1.1em; opacity: 0.8; }
  .score-card .score { font-family: 'Fredoka One', cursive; font-size: 2.5em; }

  .winner-text {
    font-family: 'Fredoka One', cursive;
    font-size: 3em;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
    margin-bottom: 10px;
  }

  .confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  /* Mobile controls */
  .mobile-controls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 50;
  }

  .mobile-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 2em;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  .mobile-btn:active {
    background: rgba(255,255,255,0.4);
  }

  .jump-btn {
    width: 90px;
    height: 90px;
    font-size: 1.2em;
    font-family: 'Fredoka One', cursive;
  }

  @media (pointer: coarse) {
    .mobile-controls { display: flex; }
  }

  .countdown-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    font-family: 'Fredoka One', cursive;
    font-size: 8em;
    color: white;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  }

  .countdown-overlay.hidden { display: none; }
</style>
</head>
<body>

<!-- MENU SCREEN -->
<div id="menu-screen">
  <img class="george-preview" id="menu-george" alt="George">
  <div class="menu-title">George Racing!</div>
  <div class="menu-subtitle">Calvin's Multiplayer Extravaganza</div>
  <div class="menu-panel">
    <input class="menu-input" id="player-name" placeholder="Your Name" maxlength="12" value="">
    <button class="btn btn-host" id="btn-host">Host Game</button>
    <div class="divider">— or —</div>
    <input class="menu-input" id="join-code" placeholder="Enter Room Code" maxlength="5" style="text-transform:uppercase; letter-spacing:4px;">
    <button class="btn btn-join" id="btn-join">Join Game</button>
    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<!-- WAITING SCREEN -->
<div id="waiting-screen">
  <img class="george-preview" id="wait-george" alt="George">
  <div class="menu-title" style="font-size:2em;">Waiting for Player...</div>
  <div class="room-code" id="display-code">-----</div>
  <div class="status-text" style="margin:15px 0;">Share this code with your friend!</div>
  <div class="status-text" id="wait-status"></div>
  <button class="btn btn-ready" id="btn-ready" style="display:none; width:250px;">Ready!</button>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <canvas id="gameCanvas"></canvas>
  <div class="mobile-controls" id="mobile-controls">
    <button class="mobile-btn" id="mb-left">◀</button>
    <button class="mobile-btn jump-btn" id="mb-jump">JUMP</button>
    <button class="mobile-btn" id="mb-right">▶</button>
  </div>
</div>

<!-- COUNTDOWN -->
<div class="countdown-overlay hidden" id="countdown-overlay">3</div>

<!-- RESULT SCREEN -->
<div id="result-screen">
  <canvas class="confetti-canvas" id="confetti-canvas"></canvas>
  <div class="winner-text" id="winner-text">Player Wins!</div>
  <div class="scores-display" id="scores-display"></div>
  <button class="btn btn-ready" id="btn-next-round" style="width:280px; margin-top:20px;">Next Round!</button>
</div>

// ============ SCREEN MANAGEMENT ============
function showScreen(id) {
  ['menu-screen','waiting-screen','game-screen','result-screen'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = 'flex';
}

// ============ NETWORKING ============
let ws = null;
let myIndex = -1;
let myName = 'Player';
let roomCode = '';
let gameSeed = 0;
let opponentState = { x: 0, y: 0, vy: 0, boosting: false };
let connected = false;

function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}`);
  
  ws.onopen = () => { connected = true; };
  
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleServerMessage(msg);
  };
  
  ws.onclose = () => {
    connected = false;
  };
}

function send(msg) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify(msg));
  }
}

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'hosted':
      roomCode = msg.code;
      myIndex = msg.playerIndex;
      document.getElementById('display-code').textContent = msg.code;
      showScreen('waiting-screen');
      break;
      
    case 'joined':
      roomCode = msg.code;
      myIndex = msg.playerIndex;
      gameSeed = msg.seed;
      document.getElementById('display-code').textContent = msg.code;
      document.getElementById('wait-status').textContent = 'Connected! Waiting for host...';
      document.getElementById('btn-ready').style.display = 'block';
      showScreen('waiting-screen');
      break;
      
    case 'opponent_joined':
      gameSeed = msg.seed;
      document.getElementById('wait-status').textContent = `${msg.name} joined!`;
      document.getElementById('btn-ready').style.display = 'block';
      break;
      
    case 'start_race':
      gameSeed = msg.seed;
      startCountdown();
      break;
      
    case 'opponent_position':
      opponentState.x = msg.x;
      opponentState.y = msg.y;
      opponentState.vy = msg.vy;
      opponentState.boosting = msg.boosting;
      break;
      
    case 'race_over':
      showResults(msg);
      break;
      
    case 'opponent_left':
      alert('Your opponent left the game!');
      location.reload();
      break;
      
    case 'error':
      document.getElementById('error-msg').textContent = msg.message;
      break;
  }
}

// ============ MENU HANDLERS ============
document.getElementById('btn-host').addEventListener('click', () => {
  myName = document.getElementById('player-name').value.trim() || 'Player 1';
  connectWS();
  setTimeout(() => send({ type: 'host', name: myName }), 500);
});

document.getElementById('btn-join').addEventListener('click', () => {
  myName = document.getElementById('player-name').value.trim() || 'Player 2';
  const code = document.getElementById('join-code').value.trim();
  if (!code) {
    document.getElementById('error-msg').textContent = 'Enter a room code!';
    return;
  }
  connectWS();
  setTimeout(() => send({ type: 'join', name: myName, code }), 500);
});

document.getElementById('btn-ready').addEventListener('click', () => {
  send({ type: 'ready' });
  document.getElementById('btn-ready').style.display = 'none';
  document.getElementById('wait-status').textContent = 'Waiting for opponent to be ready...';
});

document.getElementById('btn-next-round').addEventListener('click', () => {
  send({ type: 'ready' });
  document.getElementById('btn-next-round').disabled = true;
  document.getElementById('btn-next-round').textContent = 'Waiting...';
  showScreen('waiting-screen');
  document.getElementById('wait-status').textContent = 'Waiting for next round...';
  document.getElementById('btn-ready').style.display = 'none';
});

// ============ COUNTDOWN ============
function startCountdown() {
  showScreen('game-screen');
  const overlay = document.getElementById('countdown-overlay');
  overlay.classList.remove('hidden');
  
  const words = ['3', '2', '1', 'FETCH!'];
  let i = 0;
  
  overlay.textContent = words[0];
  
  const interval = setInterval(() => {
    i++;
    if (i < words.length) {
      overlay.textContent = words[i];
      if (i === words.length - 1) {
        overlay.style.color = '#ffd700';
        overlay.style.fontSize = '6em';
      }
    } else {
      clearInterval(interval);
      overlay.classList.add('hidden');
      overlay.style.color = 'white';
      overlay.style.fontSize = '8em';
      initGame();
    }
  }, 800);
}

// ============ SEEDED RANDOM ============
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function generateTrack() {
  const rand = seededRandom(gameSeed);
  obstacles = [];
  powerups = [];
  hazards = [];
  slobberTrails = [];
  particles = [];
  trackLength = 15000;

  // Generate 30 angry George obstacles
  for (let i = 0; i < 30; i++) {
    const yPos = 800 + (i * (trackLength - 1200) / 30) + rand() * 200 - 100;
    obstacles.push({
      x: (rand() * (LANE_WIDTH - 80)) - (LANE_WIDTH / 2 - 40),
      y: yPos,
      size: OBSTACLE_SIZE + rand() * 15,
      type: rand() > 0.5 ? 'circle' : 'triangle',
      moving: rand() > 0.6,
      moveSpeed: (rand() * 2 + 1) * (rand() > 0.5 ? 1 : -1),
      baseX: 0,
      hit: false,
    });
    obstacles[obstacles.length - 1].baseX = obstacles[obstacles.length - 1].x;
  }

  // Generate special hazards
  const hazardTypes = ['vet', 'squirrel', 'puddle', 'cat'];
  for (let i = 0; i < 12; i++) {
    const yPos = 1000 + (i * (trackLength - 1500) / 12) + rand() * 250;
    const hType = hazardTypes[Math.floor(rand() * hazardTypes.length)];
    hazards.push({
      x: (rand() * (LANE_WIDTH - 70)) - (LANE_WIDTH / 2 - 35),
      y: yPos,
      type: hType,
      size: 45,
      hit: false,
      moving: hType === 'squirrel',
      baseX: 0,
      moveSpeed: (rand() * 3 + 2) * (rand() > 0.5 ? 1 : -1),
      bobPhase: rand() * Math.PI * 2,
    });
    hazards[hazards.length - 1].baseX = hazards[hazards.length - 1].x;
  }

  // Generate 5 golden bone power-ups (speed boost)
  for (let i = 0; i < 5; i++) {
    const yPos = 1500 + i * (trackLength - 2000) / 5 + rand() * 300;
    powerups.push({
      x: (rand() * (LANE_WIDTH - 60)) - (LANE_WIDTH / 2 - 30),
      y: yPos,
      collected: false,
      bobPhase: rand() * Math.PI * 2,
      type: 'bone',
    });
  }

  // Generate 5 egg power-ups (shield)
  for (let i = 0; i < 5; i++) {
    const yPos = 1200 + i * (trackLength - 1800) / 5 + rand() * 350;
    powerups.push({
      x: (rand() * (LANE_WIDTH - 60)) - (LANE_WIDTH / 2 - 30),
      y: yPos,
      collected: false,
      bobPhase: rand() * Math.PI * 2,
      type: 'egg',
    });
  }

  // Generate 4 tennis ball power-ups (small speed boost)
  for (let i = 0; i < 4; i++) {
    const yPos = 900 + i * (trackLength - 1400) / 4 + rand() * 400;
    powerups.push({
      x: (rand() * (LANE_WIDTH - 60)) - (LANE_WIDTH / 2 - 30),
      y: yPos,
      collected: false,
      bobPhase: rand() * Math.PI * 2,
      type: 'tennis',
    });
  }
}

function initGame() {
  resizeCanvas();
  generateTrack();
  
  player = {
    x: 0,
    y: 200,
    vy: 0,
    grounded: true,
    boosting: false,
    boostTimer: 0,
    coned: false,
    coneTimer: 0,
    shielded: false,
    shieldTimer: 0,
  };
  
  opponentState = { x: 0, y: 200, vy: 0, boosting: false };
  cameraY = 0;
  raceFinished = false;
  gameRunning = true;
  slobberTrails = [];
  
  requestAnimationFrame(gameLoop);
}

let lastTime = 0;
let sendTimer = 0;
let gameTime = 0;

function gameLoop(timestamp) {
  if (!gameRunning) return;
  
  const dt = Math.min((timestamp - lastTime) / 16.67, 3);
  lastTime = timestamp;
  gameTime += dt;
  sendTimer += dt;
  
  update(dt);
  render();
  
  // Send position ~15 times per second
  if (sendTimer > 4) {
    send({
      type: 'position',
      x: player.x,
      y: player.y,
      vy: player.vy,
      boosting: player.boosting,
    });
    sendTimer = 0;
  }
  
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  if (raceFinished) return;
  
  // Auto-forward movement
  let speed = FORWARD_SPEED;
  if (player.boosting) speed = BOOST_SPEED;
  if (player.coned) speed = FORWARD_SPEED * 0.5; // Cone makes you slow!
  player.y += speed * dt;

  // Horizontal movement (slower with cone)
  const moveSpd = player.coned ? MOVE_SPEED * 0.6 : MOVE_SPEED;
  if (keys.left) player.x -= moveSpd * dt;
  if (keys.right) player.x += moveSpd * dt;

  // Clamp to lane
  const halfLane = LANE_WIDTH / 2 - PLAYER_SIZE / 2;
  player.x = Math.max(-halfLane, Math.min(halfLane, player.x));

  // Jump
  if (keys.jump && player.grounded) {
    player.vy = JUMP_FORCE;
    player.grounded = false;
  }

  // Gravity (for visual jump arc)
  if (!player.grounded) {
    player.vy += GRAVITY * dt;
    if (player.vy >= 0) {
      player.grounded = true;
      player.vy = 0;
    }
  }

  // Boost timer
  if (player.boosting) {
    player.boostTimer -= dt;
    if (Math.random() < 0.3) {
      slobberTrails.push({
        x: player.x + (Math.random() - 0.5) * 30,
        y: player.y - 10,
        life: 180,
        size: 8 + Math.random() * 8,
      });
    }
    if (player.boostTimer <= 0) {
      player.boosting = false;
    }
  }

  // Cone timer
  if (player.coned) {
    player.coneTimer -= dt;
    if (player.coneTimer <= 0) {
      player.coned = false;
    }
  }

  // Shield timer
  if (player.shielded) {
    player.shieldTimer -= dt;
    if (player.shieldTimer <= 0) {
      player.shielded = false;
    }
  }

  // Update slobber trails
  slobberTrails.forEach(s => s.life -= dt);
  slobberTrails = slobberTrails.filter(s => s.life > 0);

  // Update particles
  particles.forEach(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; });
  particles = particles.filter(p => p.life > 0);

  // Collision with angry George obstacles
  for (const obs of obstacles) {
    if (obs.hit) continue;
    if (obs.moving) {
      obs.x = obs.baseX + Math.sin(gameTime * 0.03 * obs.moveSpeed) * 60;
    }
    const dx = player.x - obs.x;
    const dy = player.y - obs.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < (PLAYER_SIZE / 2 + obs.size / 2) && player.grounded) {
      if (player.shielded) {
        // Shield absorbs the hit!
        player.shielded = false;
        player.shieldTimer = 0;
        obs.hit = true;
        setTimeout(() => { obs.hit = false; }, 2000);
        // Smash particles
        for (let p = 0; p < 8; p++) {
          particles.push({ x: obs.x, y: obs.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 40, color: '#ffd700', size: 5 + Math.random()*5 });
        }
      } else {
        player.y -= BOUNCE_BACK;
        obs.hit = true;
        setTimeout(() => { obs.hit = false; }, 2000);
      }
    }
  }

  // Collision with special hazards
  for (const hz of hazards) {
    if (hz.hit) continue;
    if (hz.moving) {
      hz.x = hz.baseX + Math.sin(gameTime * 0.05 * hz.moveSpeed) * 100;
    }
    const dx = player.x - hz.x;
    const dy = player.y - hz.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < (PLAYER_SIZE / 2 + hz.size / 2) && player.grounded) {
      if (player.shielded) {
        player.shielded = false;
        player.shieldTimer = 0;
        hz.hit = true;
        setTimeout(() => { hz.hit = false; }, 3000);
        for (let p = 0; p < 6; p++) {
          particles.push({ x: hz.x, y: hz.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 30, color: '#ffd700', size: 4 + Math.random()*4 });
        }
      } else {
        hz.hit = true;
        setTimeout(() => { hz.hit = false; }, 4000);

        if (hz.type === 'vet') {
          // CONE OF SHAME! Slow down + wider hitbox feel
          player.coned = true;
          player.coneTimer = 180; // ~3 seconds of cone
          player.y -= 30;
        } else if (hz.type === 'squirrel') {
          // Squirrel pulls George sideways!
          player.x += (Math.random() > 0.5 ? 80 : -80);
          player.y -= 20;
        } else if (hz.type === 'puddle') {
          // Bath time! George spins and slows
          player.y -= 50;
          player.coned = true;
          player.coneTimer = 90; // shorter slowdown
        } else if (hz.type === 'cat') {
          // Cat hiss! George runs backward
          player.y -= 100;
        }
      }
    }
  }

  // Collect power-ups
  for (const pu of powerups) {
    if (pu.collected) continue;
    const dx = player.x - pu.x;
    const dy = player.y - pu.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < (PLAYER_SIZE / 2 + POWERUP_SIZE / 2)) {
      pu.collected = true;
      // Sparkle particles
      for (let p = 0; p < 10; p++) {
        particles.push({ x: pu.x, y: pu.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 30, color: pu.type === 'egg' ? '#FFE4B5' : pu.type === 'tennis' ? '#ADFF2F' : '#ffd700', size: 4 + Math.random()*6 });
      }

      if (pu.type === 'bone') {
        // Golden bone = speed boost
        player.boosting = true;
        player.boostTimer = 120;
      } else if (pu.type === 'egg') {
        // Egg = shield! Protects from ONE hit
        player.shielded = true;
        player.shieldTimer = 600; // lasts a long time until used
      } else if (pu.type === 'tennis') {
        // Tennis ball = smaller speed boost
        player.boosting = true;
        player.boostTimer = 60;
      }
    }
  }
  
  // Camera follows player
  cameraY = player.y - canvas.height * 0.6;
  
  // Check finish
  if (player.y >= trackLength) {
    raceFinished = true;
    gameRunning = false;
    send({ type: 'finished' });
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const centerX = canvas.width / 2;
  
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  skyGrad.addColorStop(0, '#87CEEB');
  skyGrad.addColorStop(1, '#E0F7FA');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Scrolling clouds
  for (let i = 0; i < 5; i++) {
    const cloudY = (i * 200 + 50 - cameraY * 0.1) % (canvas.height + 100) - 50;
    const cloudX = (i * 300 + 100 + Math.sin(gameTime * 0.01 + i) * 30) % (canvas.width + 100);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(cloudX, cloudY, 60, 25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cloudX + 40, cloudY + 5, 40, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cloudX - 30, cloudY + 5, 35, 18, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Track (road)
  const trackLeft = centerX - LANE_WIDTH / 2;
  const trackRight = centerX + LANE_WIDTH / 2;
  
  ctx.fillStyle = '#90EE90';
  ctx.fillRect(trackLeft - 60, 0, LANE_WIDTH + 120, canvas.height);
  
  ctx.fillStyle = '#D2B48C';
  ctx.fillRect(trackLeft, 0, LANE_WIDTH, canvas.height);
  
  // Lane dashes
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 3;
  ctx.setLineDash([20, 20]);
  const dashOffset = (-cameraY * 1) % 40;
  ctx.lineDashOffset = dashOffset;
  ctx.beginPath();
  ctx.moveTo(centerX, 0);
  ctx.lineTo(centerX, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Track edges
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(trackLeft, 0); ctx.lineTo(trackLeft, canvas.height);
  ctx.moveTo(trackRight, 0); ctx.lineTo(trackRight, canvas.height);
  ctx.stroke();
  
  // Finish line
  const finishScreenY = trackLength - cameraY;
  if (finishScreenY > -50 && finishScreenY < canvas.height + 50) {
    ctx.save();
    const checkerSize = 20;
    for (let cx = trackLeft; cx < trackRight; cx += checkerSize) {
      for (let row = 0; row < 3; row++) {
        const isBlack = ((cx - trackLeft) / checkerSize + row) % 2 < 1;
        ctx.fillStyle = isBlack ? '#333' : 'white';
        ctx.fillRect(cx, finishScreenY + row * checkerSize - 30, checkerSize, checkerSize);
      }
    }
    ctx.restore();
    
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 24px "Fredoka One", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('FINISH!', centerX, finishScreenY - 40);
  }
  
  // Start line
  const startScreenY = 150 - cameraY;
  if (startScreenY > -50 && startScreenY < canvas.height + 50) {
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(trackLeft, startScreenY, LANE_WIDTH, 6);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 18px "Fredoka One", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('START', centerX, startScreenY - 10);
  }
  
  // Slobber trails
  slobberTrails.forEach(s => {
    const sx = centerX + s.x;
    const sy = s.y - cameraY;
    if (sy < -50 || sy > canvas.height + 50) return;
    
    ctx.globalAlpha = Math.min(1, s.life / 60) * 0.5;
    ctx.fillStyle = '#88DDFF';
    ctx.beginPath();
    ctx.ellipse(sx, sy, s.size, s.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
  
  // Particles
  particles.forEach(p => {
    const px = centerX + p.x;
    const py = p.y - cameraY;
    if (py < -50 || py > canvas.height + 50) return;
    ctx.globalAlpha = Math.min(1, p.life / 15);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Power-ups
  powerups.forEach(pu => {
    if (pu.collected) return;
    const px = centerX + pu.x;
    const py = pu.y - cameraY + Math.sin(gameTime * 0.05 + pu.bobPhase) * 8;
    if (py < -50 || py > canvas.height + 50) return;

    ctx.save();
    ctx.translate(px, py);

    if (pu.type === 'bone') {
      // Golden bone
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 20;
      ctx.fillStyle = '#FFF8DC';
      ctx.strokeStyle = '#DAA520';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-18, -6, 36, 12, 4);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(-18, -4, 8, 0, Math.PI * 2); ctx.arc(-18, 4, 8, 0, Math.PI * 2);
      ctx.arc(18, -4, 8, 0, Math.PI * 2); ctx.arc(18, 4, 8, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd700';
      ctx.font = '10px "Fredoka One"'; ctx.textAlign = 'center';
      ctx.fillText('SPEED', 0, 4);
    } else if (pu.type === 'egg') {
      // Egg power-up (shield)
      ctx.shadowColor = '#FFE4B5';
      ctx.shadowBlur = 15;
      // Egg shape
      ctx.fillStyle = '#FFF8E7';
      ctx.strokeStyle = '#DEB887';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 18, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      // Yolk highlight
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.ellipse(0, 3, 7, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#8B4513';
      ctx.font = '8px "Fredoka One"'; ctx.textAlign = 'center';
      ctx.fillText('SHIELD', 0, -22);
    } else if (pu.type === 'tennis') {
      // Tennis ball
      ctx.shadowColor = '#ADFF2F';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ADFF2F';
      ctx.strokeStyle = '#6B8E23';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      // Tennis ball line
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-5, 0, 12, -0.8, 0.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(5, 0, 12, Math.PI - 0.8, Math.PI + 0.8);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Sparkle for all power-ups
    const sparkle = Math.sin(gameTime * 0.1 + pu.bobPhase) * 0.5 + 0.5;
    ctx.globalAlpha = sparkle;
    ctx.fillStyle = '#ffd700';
    ctx.font = '14px serif';
    ctx.fillText('✨', 15, -15);
    ctx.globalAlpha = 1;

    ctx.restore();
  });

  // Special hazards
  hazards.forEach(hz => {
    const hx = centerX + hz.x;
    const hy = hz.y - cameraY + (hz.type !== 'squirrel' ? 0 : Math.sin(gameTime * 0.08 + hz.bobPhase) * 3);
    if (hy < -80 || hy > canvas.height + 80) return;

    ctx.save();
    ctx.translate(hx, hy);
    if (hz.hit) ctx.globalAlpha = 0.3;

    const sz = hz.size;

    if (hz.type === 'vet') {
      // Vet office - syringe/cone icon
      ctx.fillStyle = '#E8E8E8';
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 2;
      // Cone shape
      ctx.beginPath();
      ctx.moveTo(0, -sz/2);
      ctx.lineTo(-sz/2, sz/3);
      ctx.lineTo(sz/2, sz/3);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // Red cross
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(-4, -15, 8, 20);
      ctx.fillRect(-10, -9, 20, 8);
      // Label
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 9px "Fredoka One"'; ctx.textAlign = 'center';
      ctx.fillText('VET!', 0, sz/2 + 12);
    } else if (hz.type === 'squirrel') {
      // Squirrel - brown fuzzy thing with big tail
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      // Tail
      ctx.beginPath();
      ctx.ellipse(-10, -12, 8, 16, -0.5, 0, Math.PI * 2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(-4, -4, 4, 0, Math.PI * 2); ctx.arc(4, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'black';
      ctx.beginPath();
      ctx.arc(-4, -4, 2, 0, Math.PI * 2); ctx.arc(4, -4, 2, 0, Math.PI * 2);
      ctx.fill();
      // Acorn
      ctx.fillStyle = '#DAA520';
      ctx.beginPath();
      ctx.arc(0, 8, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8B4513';
      ctx.font = 'bold 9px "Fredoka One"'; ctx.textAlign = 'center';
      ctx.fillText('SQUIRREL!', 0, sz/2 + 8);
    } else if (hz.type === 'puddle') {
      // Bath puddle - blue splashy water
      ctx.fillStyle = 'rgba(70, 170, 255, 0.6)';
      ctx.beginPath();
      ctx.ellipse(0, 0, sz/2 + 5, sz/4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#2196F3';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Bubbles
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(-8, -5, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.arc(10, -3, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.arc(2, -8, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2196F3';
      ctx.font = 'bold 9px "Fredoka One"'; ctx.textAlign = 'center';
      ctx.fillText('BATH!', 0, sz/2);
    } else if (hz.type === 'cat') {
      // Cat - pointy ears, mean face
      ctx.fillStyle = '#555';
      ctx.beginPath();
      ctx.ellipse(0, 2, 14, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      // Ears
      ctx.beginPath();
      ctx.moveTo(-10, -12); ctx.lineTo(-6, -24); ctx.lineTo(-2, -12);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(2, -12); ctx.lineTo(6, -24); ctx.lineTo(10, -12);
      ctx.fill();
      // Inner ears
      ctx.fillStyle = '#ffaaaa';
      ctx.beginPath();
      ctx.moveTo(-8, -13); ctx.lineTo(-6, -20); ctx.lineTo(-4, -13);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(4, -13); ctx.lineTo(6, -20); ctx.lineTo(8, -13);
      ctx.fill();
      // Mean eyes
      ctx.fillStyle = '#ADFF2F';
      ctx.beginPath();
      ctx.arc(-5, -2, 4, 0, Math.PI * 2); ctx.arc(5, -2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'black';
      ctx.beginPath();
      ctx.ellipse(-5, -2, 1.5, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(5, -2, 1.5, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      // Whiskers
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-14, 4); ctx.lineTo(-5, 6);
      ctx.moveTo(-14, 7); ctx.lineTo(-5, 7);
      ctx.moveTo(14, 4); ctx.lineTo(5, 6);
      ctx.moveTo(14, 7); ctx.lineTo(5, 7);
      ctx.stroke();
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 9px "Fredoka One"'; ctx.textAlign = 'center';
      ctx.fillText('HISSS!', 0, sz/2 + 8);
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  });
  
  // Obstacles (angry George)
  obstacles.forEach(obs => {
    const ox = centerX + obs.x;
    const oy = obs.y - cameraY;
    if (oy < -80 || oy > canvas.height + 80) return;
    
    const sz = obs.size;
    
    ctx.save();
    ctx.translate(ox, oy);
    
    if (obs.hit) {
      ctx.globalAlpha = 0.4;
    }
    
    // Draw angry George as obstacle
    ctx.beginPath();
    ctx.arc(0, 0, sz / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.save();
    ctx.clip();
    ctx.drawImage(angryImg, -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
    
    // Red border
    ctx.strokeStyle = obs.hit ? 'rgba(255,0,0,0.3)' : '#ff4444';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, sz / 2, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.globalAlpha = 1;
    ctx.restore();
  });
  
  // Opponent
  const oppScreenX = centerX + opponentState.x;
  const oppScreenY = opponentState.y - cameraY + opponentState.vy;
  if (oppScreenY > -80 && oppScreenY < canvas.height + 80) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.translate(oppScreenX, oppScreenY);
    
    const oSize = PLAYER_SIZE;
    ctx.beginPath();
    ctx.arc(0, 0, oSize / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.save();
    ctx.clip();
    ctx.drawImage(happyImg, -oSize / 2, -oSize / 2, oSize, oSize);
    ctx.restore();
    
    ctx.strokeStyle = 'rgba(100,100,255,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, oSize / 2, 0, Math.PI * 2);
    ctx.stroke();
    
    // Name tag
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = 'bold 12px Nunito';
    ctx.textAlign = 'center';
    ctx.fillText('Opponent', 0, -oSize / 2 - 8);
    
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  
  // Player (happy George)
  const pScreenX = centerX + player.x;
  const pScreenY = player.y - cameraY + player.vy * 2;
  
  ctx.save();
  ctx.translate(pScreenX, pScreenY);
  
  // Boost effect
  if (player.boosting) {
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 25;
    
    // Speed lines
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = `rgba(255, 215, 0, ${0.5 - i * 0.15})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-15 + i * 15, PLAYER_SIZE / 2 + 5);
      ctx.lineTo(-15 + i * 15, PLAYER_SIZE / 2 + 20 + Math.random() * 10);
      ctx.stroke();
    }
  }
  
  // Jump shadow
  if (!player.grounded) {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, PLAYER_SIZE / 2 - player.vy * 2, PLAYER_SIZE / 2.5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  const pSize = PLAYER_SIZE;
  ctx.beginPath();
  ctx.arc(0, 0, pSize / 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.save();
  ctx.clip();
  ctx.drawImage(happyImg, -pSize / 2, -pSize / 2, pSize, pSize);
  ctx.restore();
  
  // Border color based on state
  const borderColor = player.boosting ? '#ffd700' : player.coned ? '#999' : '#44ff44';
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, pSize / 2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.shadowBlur = 0;

  // CONE OF SHAME!
  if (player.coned) {
    ctx.strokeStyle = '#E8E8E8';
    ctx.fillStyle = 'rgba(232, 232, 232, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-pSize/2 - 10, -pSize/2 - 5);
    ctx.lineTo(-pSize/3, pSize/4);
    ctx.lineTo(pSize/3, pSize/4);
    ctx.lineTo(pSize/2 + 10, -pSize/2 - 5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // "Cone of Shame" text
    ctx.fillStyle = '#ff6666';
    ctx.font = 'bold 10px "Fredoka One"';
    ctx.textAlign = 'center';
    ctx.fillText('CONE!', 0, -pSize/2 - 12);
  }

  // SHIELD BUBBLE
  if (player.shielded) {
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.lineDashOffset = gameTime * 2;
    ctx.beginPath();
    ctx.arc(0, 0, pSize/2 + 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // Egg icon floating above
    ctx.fillStyle = '#FFF8E7';
    ctx.beginPath();
    ctx.ellipse(pSize/2 + 5, -pSize/2 - 5, 5, 7, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.ellipse(pSize/2 + 5, -pSize/2 - 3, 3, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Name tag
  ctx.fillStyle = 'white';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  ctx.font = 'bold 13px Nunito';
  ctx.textAlign = 'center';
  ctx.strokeText(myName, 0, -pSize / 2 - 8);
  ctx.fillText(myName, 0, -pSize / 2 - 8);
  
  ctx.restore();
  
  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(10, 10, 200, 60);
  ctx.fillStyle = 'white';
  ctx.font = 'bold 14px Nunito';
  ctx.textAlign = 'left';
  
  const progress = Math.min(100, Math.floor((player.y / trackLength) * 100));
  const oppProgress = Math.min(100, Math.floor((opponentState.y / trackLength) * 100));
  
  ctx.fillText(`You: ${progress}%`, 20, 32);
  ctx.fillText(`Opponent: ${oppProgress}%`, 20, 52);
  
  // Progress bars
  ctx.fillStyle = '#44ff44';
  ctx.fillRect(120, 22, progress * 0.8, 10);
  ctx.fillStyle = '#4488ff';
  ctx.fillRect(120, 42, oppProgress * 0.8, 10);
  
  // Status indicators
  ctx.font = 'bold 20px "Fredoka One", cursive';
  ctx.textAlign = 'center';
  if (player.boosting) {
    ctx.fillStyle = '#ffd700';
    ctx.fillText('SPEED BOOST!', canvas.width / 2, 40);
  }
  if (player.coned) {
    ctx.fillStyle = '#ff6666';
    ctx.fillText('CONE OF SHAME!', canvas.width / 2, 70);
  }
  if (player.shielded) {
    ctx.fillStyle = '#FFE4B5';
    ctx.fillText('EGG SHIELD!', canvas.width / 2, player.boosting ? 70 : 40);
  }
}

// ============ RESULTS ============
function showResults(msg) {
  gameRunning = false;
  showScreen('result-screen');
  
  const isWinner = msg.winner === myIndex;
  document.getElementById('winner-text').textContent = 
    isWinner ? 'YOU WIN! 🎉' : `${msg.winnerName} Wins!`;
  
  const scoresDiv = document.getElementById('scores-display');
  scoresDiv.innerHTML = msg.scores.map(s => `
    <div class="score-card">
      <div class="name">${s.name}</div>
      <div class="score">${s.score}</div>
    </div>
  `).join('');
  
  document.getElementById('btn-next-round').disabled = false;
  document.getElementById('btn-next-round').textContent = 'Next Round!';
  
  // Confetti!
  if (isWinner) spawnConfetti();
}

function spawnConfetti() {
  const confettiCanvas = document.getElementById('confetti-canvas');
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  const cCtx = confettiCanvas.getContext('2d');
  
  const pieces = [];
  const colors = ['#ff6b6b', '#ffd700', '#4ecdc4', '#45b7d1', '#f093fb', '#00f2fe', '#43e97b'];
  
  for (let i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * confettiCanvas.height - confettiCanvas.height,
      w: Math.random() * 12 + 5,
      h: Math.random() * 8 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 3 + 2,
      vx: (Math.random() - 0.5) * 2,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
    });
  }
  
  function animateConfetti() {
    cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    
    pieces.forEach(p => {
      p.y += p.vy;
      p.x += p.vx;
      p.rotation += p.rotSpeed;
      
      if (p.y < confettiCanvas.height + 20) alive = true;
      
      cCtx.save();
      cCtx.translate(p.x, p.y);
      cCtx.rotate(p.rotation * Math.PI / 180);
      cCtx.fillStyle = p.color;
      cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cCtx.restore();
    });
    
    if (alive) requestAnimationFrame(animateConfetti);
  }
  
  animateConfetti();
}

// ============ INPUT HANDLING ============
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowLeft': case 'a': keys.left = true; break;
    case 'ArrowRight': case 'd': keys.right = true; break;
    case 'ArrowUp': case 'w': case ' ': keys.jump = true; e.preventDefault(); break;
  }
});

document.addEventListener('keyup', (e) => {
  switch (e.key) {
    case 'ArrowLeft': case 'a': keys.left = false; break;
    case 'ArrowRight': case 'd': keys.right = false; break;
    case 'ArrowUp': case 'w': case ' ': keys.jump = false; break;
  }
});

// Mobile controls
function addTouchControl(id, keyName) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
  el.addEventListener('touchcancel', (e) => { keys[keyName] = false; });
}

addTouchControl('mb-left', 'left');
addTouchControl('mb-right', 'right');
addTouchControl('mb-jump', 'jump');
</script>
